# Fresh game from the title screen: no save files at all. The bot must
# start a new run, get through the intro, and act on the first town.
SAVE="$ROOT/work/save-backup/save-empty"
TIMEOUT=900
SPEED=8
ASSERT=(
  'bot@state=fresh'
  'level_enter'
  'container_open'
  'level_done@world=firstDungeon-01'
  'dungeon_done@dungeon=firstDungeon-01'
  'level_enter@from=firstDungeon-01'
  '!death'
  '!confirm_unknown'
)
