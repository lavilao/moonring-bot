# Start inside the Yarrow Cave (firstDungeon-01) with the full-loot policy.
# Derived from save-075659 by rewriting checkpoint.txt to the dungeon's
# playerStart trigger (41,68); all level saves are carried over.
SAVE="$ROOT/work/save-backup/save-dungeon-start"
TIMEOUT=300
SPEED=8
ASSERT=(
  'level_enter@world=firstDungeon-01'
  'container_seen'
  'container_open'
  'dungeon_blocked@reason=chest_key_missing'
  'level_done@world=firstDungeon-01'
  '!alert_stuck'
  '!confirm_unknown'
)
